# 70 — Key bindings
#
# The same keys as iNiR's Niri config, mapped to Umbriel's actions (`umbriel msg --help` lists them). Mod is Super
# (Alt when Umbriel runs nested). iNiR's own actions go through `inir <target> <function>`; `inir --help` lists them.
# Rebind or remove a key in config.d/90-user-extra.toml: a key set there replaces this one, `"Mod+X" = ""` unbinds it.
#
# Umbriel-only keys iNiR adds: Mod+W tabs a column, Mod+P pins a window, Mod+Shift+Tab cycles the workspace layout
# (scrolling, dwindle, master, stacking), Mod+` shows the scratchpad and Mod+Shift+` sends a window there.

[keybinds]

# System
"Mod+Tab" = { action = "overview-toggle", repeat = false }
"Mod+Shift+E" = "session-quit"
"Mod+Escape" = { action = "shortcuts-inhibit-toggle", allow_when_inhibited = true, repeat = false }
"Mod+Shift+O" = "dpms-off"

# ── System & Reload ────────────────────────────────────────────────────────────
"Mod+Shift+R" = { action = "spawn sh -c 'umbriel msg config-reload && sound-system config-reload'", repeat = false }
"Ctrl+Mod+R" = { action = "spawn sh -c 'umbriel msg config-reload && sound-system config-reload'", repeat = false }
"Mod+Alt+L" = { action = "spawn sh -c 'sound-system locking-screen && inir lock activate'", allow_when_locked = true }

# iNiR shell
"Super+G" = "spawn inir overlay toggle"
"Mod+Space" = { action = "spawn inir overview toggle", repeat = false }
"Mod+V" = "spawn inir clipboard toggle"
# "Mod+Alt+L" = { action = "spawn inir lock activate", allow_when_locked = true }
"Mod+Ctrl+Shift+L" = { action = "spawn inir lock focus", allow_when_locked = true }
"Mod+Shift+S" = "spawn inir region menu"
"Ctrl+Shift+S" = "spawn inir region menu"
"Mod+Shift+X" = "spawn inir region ocr"
"Mod+Shift+A" = "spawn inir region search"
#"Mod+Shift+R" = "spawn inir region recordWithSound"
"Ctrl+Alt+T" = "spawn inir wallpaperSelector toggle"
"Mod+Comma" = "spawn inir settings"
"Mod+Slash" = "spawn inir cheatsheet toggle"
"Mod+Shift+W" = "spawn inir panelFamily cycle"
"Mod+Shift+Q" = "spawn inir session toggle"
"Ctrl+Alt+F" = "spawn inir equalizer toggle"
"Alt+Tab" = "spawn inir altSwitcher next"
"Alt+Shift+Tab" = "spawn inir altSwitcher previous"

# Apps
"Mod+T" = "spawn inir terminal"
#"Mod+Return" = "spawn inir terminal"
"Super+E" = "spawn dolphin"
#"Super+W" = "spawn inir browser"

# ── App & Mode Launchers ───────────────────────────────────────────────────────
"Mod+Return" = { action = "spawn sh -c 'sound-system open-terminal && ghostty'", repeat = false }
"Mod+E" = { action = "spawn sh -c 'sound-system open-files && ghostty -e yazi'", repeat = false }
"Super+W" = { action = "spawn sh -c 'sound-system launch-browser && inir browser'", repeat = false }
"Mod+O" = { action = "spawn sh -c 'sound-system launch-obs && flatpak run --env=QT_QPA_PLATFORM=xcb com.obsproject.Studio'", repeat = false }
"Mod+Alt+S" = { action = "spawn sh -c 'sound-system steam-launch && steam'", repeat = false }
"Mod+Shift+G" = { action = "spawn sound-system gaming-toggle", repeat = false }

# Terminal & Yazi (Nano-first)
"Mod+Alt+Return" = { action = "spawn sh -c \"/usr/bin/sound-system open-terminal && ghostty\"", repeat = false }
"Super+Alt+E" = { action = "spawn ghostty -e yazi", repeat = false }

# Native close-window (replaces slow `spawn inir close-window` from 70-binds)
# "Mod+Q" = { action = "window-close", repeat = false }


# Isolated Webapps
"Mod+Ctrl+T" = { action = "spawn sh -c \"~/.config/niri/scripts/webapp-launcher.sh twitch\"", repeat = false }
"Mod+Ctrl+Y" = { action = "spawn sh -c \"~/.config/niri/scripts/webapp-launcher.sh youtube\"", repeat = false }
"Mod+Ctrl+S" = { action = "spawn sh -c \"~/.config/niri/scripts/webapp-launcher.sh spotify\"", repeat = false }
"Mod+Ctrl+D" = { action = "spawn sh -c \"~/.config/niri/scripts/webapp-launcher.sh discord\"", repeat = false }

# ── Window Actions with J.A.R.V.I.S. Feedback ──────────────────────────────────
"Mod+Q" = { action = "spawn sh -c 'umbriel msg window-close && sound-system window-close'", repeat = false }
"Mod+F" = { action = "spawn sh -c 'umbriel msg window-toggle-fullscreen && sound-system window-fullscreen'", repeat = false }
"Mod+A" = { action = "spawn sh -c 'umbriel msg window-toggle-floating && sound-system window-float'", repeat = false }
"Mod+C" = { action = "spawn sh -c 'umbriel msg column-center && sound-system window-center'", repeat = false }

# Windows
"Mod+D" = "window-toggle-maximize"
#"Mod+F" = { action = "window-toggle-fullscreen", repeat = false }
# "Mod+A" = { action = "window-toggle-floating", repeat = false }
"Mod+Shift+V" = { action = "window-focus-switch-floating", repeat = false }
"Mod+R" = "window-cycle-primary-extent"
# "Mod+C" = "column-center"
"Mod+Minus" = "window-modify-primary-extent -0.1"
"Mod+Equal" = "window-modify-primary-extent +0.1"
"Mod+Shift+Minus" = "window-modify-secondary-extent -0.1"
"Mod+Shift+Equal" = "window-modify-secondary-extent +0.1"
"Mod+BracketLeft" = "window-consume-or-expel-left"
"Mod+BracketRight" = "window-consume-or-expel-right"
"Mod+W" = { action = "column-toggle-tabbed", repeat = false }
"Mod+P" = { action = "window-toggle-pinned", repeat = false }

# Focus
"Mod+Left" = "window-focus-left"
"Mod+Right" = "window-focus-right"
"Mod+H" = "window-focus-left"
"Mod+L" = "window-focus-right"
"Mod+Up" = "window-focus-up"
"Mod+Down" = "window-focus-down"
"Mod+K" = "window-focus-up"
"Mod+J" = "window-focus-down"
"Mod+Home" = "column-focus-first"
"Mod+End" = "column-focus-last"

# Move
"Mod+Shift+Left" = "column-move-left"
"Mod+Shift+Right" = "column-move-right"
"Mod+Shift+H" = "column-move-left"
"Mod+Shift+L" = "column-move-right"
"Mod+Shift+Up" = "window-move-up"
"Mod+Shift+Down" = "window-move-down"
"Mod+Shift+K" = "window-move-up"
"Mod+Shift+J" = "window-move-down"
"Mod+Ctrl+Home" = "column-move-to-first"
"Mod+Ctrl+End" = "column-move-to-last"

# Monitors
"Mod+Ctrl+Left" = "output-focus-left"
"Mod+Ctrl+Right" = "output-focus-right"
"Mod+Ctrl+Up" = "output-focus-up"
"Mod+Ctrl+Down" = "output-focus-down"
"Mod+Ctrl+Shift+Left" = "column-move-to-output-left"
"Mod+Ctrl+Shift+Right" = "column-move-to-output-right"
"Mod+Ctrl+Shift+Up" = "column-move-to-output-up"
"Mod+Ctrl+Shift+Down" = "column-move-to-output-down"

# ── Workspace Switching (Updates Voice Context & Plays Audio) ──────────────────
"Mod+1" = "spawn sh -c 'umbriel msg workspace-switch Browser && sound-system workspace Browser'"
"Mod+2" = "spawn sh -c 'umbriel msg workspace-switch Term && sound-system workspace Term'"
"Mod+3" = "spawn sh -c 'umbriel msg workspace-switch Gaming && sound-system workspace Gaming'"
"Mod+4" = "spawn sh -c 'umbriel msg workspace-switch Photo && sound-system workspace Photo'"
"Mod+5" = "spawn sh -c 'umbriel msg workspace-switch Media && sound-system workspace Media'"
"Mod+6" = "spawn sh -c 'umbriel msg workspace-switch Stream && sound-system workspace Stream'"
"Mod+7" = "spawn sh -c 'umbriel msg workspace-switch Comm && sound-system workspace Comm'"
"Mod+8" = "spawn sh -c 'umbriel msg workspace-switch Music && sound-system workspace Music'"
"Mod+9" = "spawn sh -c 'umbriel msg workspace-switch Files && sound-system workspace Files'"
"Mod+0" = "spawn sh -c 'umbriel msg workspace-switch Misc && sound-system workspace Misc'"

"Mod+Page_Down" = "spawn sh -c 'umbriel msg workspace-next && sound-system workspace-next'"
"Mod+Page_Up" = "spawn sh -c 'umbriel msg workspace-previous && sound-system workspace-previous'"

