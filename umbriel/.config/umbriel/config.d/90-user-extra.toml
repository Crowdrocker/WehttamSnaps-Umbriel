# 90 — Yours. iNiR creates this file once and never touches it again; it loads last, so what you set here wins.
#
# Examples:
#
#   [keybinds]
#   "Mod+T" = "spawn foot"        # rebind a key
#   "Mod+W" = ""                  # unbind one of iNiR's
#
#   [output.DP-1]
#   mode = "2560x1440@165"
#   scale = 1.25
#
# Every key Umbriel knows: umbriel config schema --json. Check a change: umbriel config validate.
# ==============================================================================
# 90 — WehttamSnaps Custom Overrides (Survives `inir compositor sync`)
# ==============================================================================

# ── 1. Shaders & Cyberpunk Borders ─────────────────────────────────────────────
[effects]
border = "spectrum"


# ==============================================================================
# Multi-Monitor Workspace Layout Array
# ==============================================================================

# ─── PRIMARY MONITOR (Samsung 4K - Left) ───
[output.DP-1]
mode = "1920x1080@60"
position = [0, 0]
scale = 1
workspaces = ["Browser", "Term", "Gaming", "Photo", "Media"]
hdr = "auto"
#transform
#enabled
#vrr

# ─── SECONDARY MONITOR (Samsung - Right) ───
[output.DP-2]
mode = "1920x1080@60"
position = [1920, 0]
scale = 1
workspaces = ["Stream", "Comm", "Music", "Files", "Misc", "Leu"]



# ==============================================================================
# SNAPS-OS Scratchpad Configuration
# ==============================================================================

# Registers the custom scratchpad block layout properties on your system
[[scratchpad]]
name = "dropdown"

# ─────────────────────────────────────────────────────────────────────────
# Dropdown Window Matching Rule
# ─────────────────────────────────────────────────────────────────────────
[[window_rule]]
match.app_id = "ghostty-dropdown"
default_scratchpad = "dropdown"

# Sizing and float parameters are applied directly as window constraints here:
default_floating = true

# ─────────────────────────────────────────────────────────────────────────
# Game Launcher TUI Scratchpad
# ─────────────────────────────────────────────────────────────────────────

[[window_rule]]
match.app_id = "^ghostty-gamelauncher$"
default_scratchpad = "games"
default_floating = true
default_floating_size_px = { width = 1000, height = 700 }
border_color_focused = "#89dceb"

# ─────────────────────────────────────────────────────────────────────────
# Spotify Scratchpad
# ─────────────────────────────────────────────────────────────────────────

[[window_rule]]
match.app_id = "^([Ss]potify|spotify-launcher)$"
default_scratchpad = "music"
default_floating = true
default_floating_size_px = { width = 1280, height = 800 }
border_color_focused = "#a6e3a1"

# Prevent full-screen scratchpad backdrop blur/dim from sticking when TUI apps exit
[animation.scratchpad]
enabled = true
blur = false
dim = 0.0



# ==============================================================================
# Window Rules
# ==============================================================================

# Assign your default browser
[[window_rule]]
match.app_id = "waterfox"
default_workspace = "Browser"

# Assign Telegram
[[window_rule]]
match.app_id = "Telegram"
default_workspace = "Comm"

# Assign Dolphin file manager
[[window_rule]]
match.app_id = "org.kde.dolphin"
default_workspace = "Files"

# ==============================================================================
# Gaming & Modding Window Rules
# ==============================================================================
# Gamescope isolated game containers -> Gaming workspace + Fullscreen
[[window_rule]]
match.app_id = "^gamescope$"
default_workspace = "Gaming"
default_fullscreen = true

# Horizon Forbidden West & general Steam games -> Gaming workspace + Fullscreen
[[window_rule]]
match.app_id = "^steam_app_.*$"
default_workspace = "Gaming"
default_fullscreen = true

# Game Launchers (Steam, Lutris, Heroic)
[[window_rule]]
match.app_id = "^(steam|lutris|heroic)$"
default_workspace = "Gaming"

# Fullscreen Games (Cyberpunk, Fallout 4, The Division 2)
[[window_rule]]
match.title = "^(Cyberpunk 2077|Fallout4|The Division 2)$"
default_workspace = "Gaming"
default_fullscreen = true

# Wine/Proton Game Executables
[[window_rule]]
match.app_id = "^(battle.net.exe|UbisoftConnect.exe)$"
default_workspace = "Gaming"

# ─── MODDING TOOLS & STEAM POPUPS (Floating) ───
# Keeps specialized utilities manageable outside the tiling grid
[[window_rule]]
match.title = "^(Vortex|Mod Organizer|Mod Organizer 2|Wabbajack|Special Offers|Friends List|Steam Settings)$"
default_workspace = "Gaming"
default_floating = true

[[window_rule]]
match.app_id = "^com.nexusmods"
default_workspace = "Gaming"
default_floating = true

# Wabbajack Modpack Configurations / Fallbacks
[[window_rule]]
match.app_id = "steam_app_0"
default_workspace = "Misc"



# ==============================================================================
# Streaming, Creative, & Communication Window Rules
# ==============================================================================

# OBS Studio (handles both native 'obs' and Flatpak 'com.obsproject.Studio')
[[window_rule]]
match.app_id = "^(obs|com\\.obsproject\\.Studio)$"
default_workspace = "Stream"
default_maximize = true
background_render = true

# ─── PHOTOGRAPHY & GRAPHICS (Photo Workspace - DP-2) ───
[[window_rule]]
match.app_id = "^(gimp|gimp-2.10|darktable|krita|inkscape|digikam|rawtherapee)$"
default_workspace = "Photo"
default_maximize = true

# ─── VIDEO EDITING (Media Workspace - DP-2) ───
[[window_rule]]
match.app_id = "^(resolve|kdenlive)$"
default_workspace = "Media"
default_maximize = true

# ─── COMMUNICATION (Comm Workspace - DP-1) ───
[[window_rule]]
match.app_id = "^(discord|telegramdesktop|slack|Telegram)$"
default_workspace = "Comm"

# ─── MUSIC & AUDIO (Music Workspace - DP-1) ───
[[window_rule]]
match.app_id = "spotify"
default_workspace = "Music"
default_maximize = true

# ─── CODE & TEXT EDITORS (Term Workspace - DP-2) ───
[[window_rule]]
match.app_id = "^(code|org.kde.kate)$"
default_workspace = "Term"
default_maximize = true

# ── 6. Custom Keybinds & Overrides ─────────────────────────────────────────────

[keybinds]
# Replace Niri reload command with Umbriel native reload
"Mod+Shift+R" = "config-reload"

# Fix broken TOML quote escaping on SNAPS-OS tips
"Mod+0" = "spawn sh -c 'notify-send \"SNAPS-OS Tips\" \"$(shuf -n 1 ~/.config/snapsos/tips/tips.list | sed \"s/.*: //\")\"'"

# Fix Yazi launch command inside Ghostty
"Mod+E" = { action = "spawn ghostty -e yazi", repeat = false }

# Override direct game-launcher spawn with your Umbriel scratchpad toggle
"Mod+Alt+G" = { action = "scratchpad-toggle games", repeat = false }
"Alt+Shift+P" = { action = "scratchpad-toggle music", repeat = false }

# Restore iNiR native volume/mute controls over the wpctl fallback
"XF86AudioRaiseVolume" = { action = "spawn inir audio volumeUp", allow_when_locked = true }
"XF86AudioLowerVolume" = { action = "spawn inir audio volumeDown", allow_when_locked = true }
"XF86AudioMute" = { action = "spawn inir audio mute", allow_when_locked = true }

