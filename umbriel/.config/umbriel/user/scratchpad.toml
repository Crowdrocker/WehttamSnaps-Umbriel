# ==============================================================================
# SNAPS-OS Scratchpad Configuration
# ==============================================================================

# Registers the custom scratchpad block layout properties on your system
[[scratchpad]]
name = "dropdown"

# ─────────────────────────────────────────────────────────────────────────
# Dropdown Window Matching Rule
# ─────────────────────────────────────────────────────────────────────────
[[window_rule]]
match.app_id = "ghostty-dropdown"
default_scratchpad = "dropdown"

# Sizing and float parameters are applied directly as window constraints here:
default_floating = true

# ─────────────────────────────────────────────────────────────────────────
# Game Launcher TUI Scratchpad
# ─────────────────────────────────────────────────────────────────────────
[[scratchpad]]
name = "games"
spawn_when_empty = "ghostty --class=ghostty-gamelauncher -e python3 /usr/bin/game-launcher"

[[window_rule]]
match.app_id = "^ghostty-gamelauncher$"
default_scratchpad = "games"
default_floating = true
default_floating_size_px = { width = 1000, height = 700 }
border_color_focused = "#89dceb"

# ─────────────────────────────────────────────────────────────────────────
# Spotify Scratchpad
# ─────────────────────────────────────────────────────────────────────────
[[scratchpad]]
name = "music"
spawn_when_empty = "spotify-launcher"

[[window_rule]]
match.app_id = "^([Ss]potify|spotify-launcher)$"
default_scratchpad = "music"
default_floating = true
default_floating_size_px = { width = 1280, height = 800 }
border_color_focused = "#a6e3a1"







