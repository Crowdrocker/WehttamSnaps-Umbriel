# --- Layout Visual Geometry ---
legacy_layout=0
horizontal
horizontal_stretch=0
frame_timing=1
font_size=20
background_alpha=0.4
round_corners=8

# --- GPU Metrics Tracking ---
gpu_stats
gpu_text=RX 7600
gpu_load_change
gpu_load_color=a6e3a1,f38ba8
gpu_temp
gpu_core_clock
gpu_vram

# --- CPU Metrics Tracking ---
cpu_stats
cpu_text=9600X
cpu_load_change
cpu_load_color=a6e3a1,f38ba8
cpu_temp
cpu_mhz

# --- RAM & Engine Profiling ---
ram
fps
frame_times
fps_limit_line=1

# --- Display Metadata Tokens ---
vulkan_driver
wine

# --- Essential Keybind Triggers ---
toggle_hud=Shift_R+F12
reload_config=Shift_L+F4

